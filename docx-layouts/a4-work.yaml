# a4-work.yaml — pandoc defaults for the a4-work DOCX layout.
#
# Unlike the PDF layouts, almost nothing about a DOCX's look can be set here:
# Word resolves every paragraph to a named style, so fonts, sizes, colours and
# the callout boxes all live in the reference document a4-work.docx (generated
# by scripts/make_docx_reference.py and auto-discovered by 2docx.sh). This file
# carries only conversion options.
to: docx
standalone: true

# Dutch as the document language, so Word spell-checks a WDODelta document in
# Dutch instead of the reference document's default.
metadata:
  lang: nl-NL
